name: CD Services
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: services-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, context: '.', dockerfile: server/Dockerfile}
          - {name: web, context: web, dockerfile: web/Dockerfile}
          - {name: translation, context: services/translation, dockerfile: services/translation/Dockerfile}
          - {name: render, context: '.', dockerfile: services/render/Dockerfile}
          - {name: transcription, context: '.', dockerfile: services/transcription/Dockerfile}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify CI passed for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=push&per_page=100" --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "No successful CI exists for this commit. Wait for CI before publishing."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Immutable image tag
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}:$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  deploy-windows:
    needs: publish
    if: vars.DEPLOY_LOCAL_WINDOWS == 'true'
    runs-on: [self-hosted, Windows, dubchef]
    environment: local-docker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Update local stack and verify readiness
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
          DUBCHEF_DEPLOY_DIR: ${{ vars.DUBCHEF_DEPLOY_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DUBCHEF_DEPLOY_DIR) { throw 'Set DUBCHEF_DEPLOY_DIR to the folder containing your existing .env' }
          $env:DUBCHEF_IMAGE_PREFIX = 'ghcr.io/' + '${{ github.repository }}'.ToLowerInvariant()
          $env:DUBCHEF_RELEASE = (git rev-parse HEAD).Trim()
          $env:GH_TOKEN | docker login ghcr.io -u $env:GH_USER --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'Registry login failed' }
          & ./scripts/deploy-windows.ps1 -DataDirectory $env:DUBCHEF_DEPLOY_DIR
